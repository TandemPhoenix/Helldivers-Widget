<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Helldivers Planet Stream Widget</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: transparent !important;
    }

    /* 🔒 DO NOT enable this yet.
       Once the app is rendering correctly, we’ll replace `.SLOT1_SELECTOR_HERE`
       with the real selector and then uncomment this block.

    body * {
      visibility: hidden !important;
    }

    .SLOT1_SELECTOR_HERE,
    .SLOT1_SELECTOR_HERE * {
      visibility: visible !important;
    }
    */
  </style>
</head>

<body>
  <div id="app-root"></div>

  <script type="module">
    // SvelteKit needs this global config
    window.__sveltekit_lmigvt = {
      base: new URL(".", location).pathname.slice(0, -1)
    };

    const element = document.getElementById("app-root");

    Promise.all([
      import("https://helldiverscompanion.com/_app/immutable/entry/start.DyFLRaQv.js"),
      import("https://helldiverscompanion.com/_app/immutable/entry/app.D0QBcvWo.js")
    ]).then(([kit, app]) => {
      kit.start(app, element);
    }).catch((err) => {
      console.error("Error booting Helldivers Companion:", err);
    });
  </script>
</body>
</html>
