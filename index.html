<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Helldivers 2 Planet Overlay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f8fafc;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      min-width: 320px;
      max-width: 480px;
      padding: 16px 20px;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.85); /* dark, slightly see-through */
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(148, 163, 184, 0.5);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 6px;
    }

    .planet-name {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .sector-name {
      font-size: 0.85rem;
      text-transform: uppercase;
      color: #9ca3af;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 6px 0 10px;
      font-size: 0.95rem;
    }

    .status-label {
      font-weight: 600;
      color: #e5e7eb;
    }

    .status-value {
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.95rem;
      color: #e5e7eb;
    }

    .progress-bar {
      position: relative;
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: rgba(31, 41, 55, 0.9);
      overflow: hidden;
      margin-bottom: 10px;
    }

    .progress-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #22c55e, #a3e635);
      width: 0%;
      transition: width 0.6s ease-out;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.8rem;
      color: #9ca3af;
    }

    .meta-pill {
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.5);
      background: rgba(15, 23, 42, 0.8);
    }

    .error {
      color: #fecaca;
      font-size: 0.9rem;
    }
  </style>
</head>

				{
					__sveltekit_lmigvt = {

					});

			</script>
		</div>
</body>
</html>
