<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Helldivers 2 Planet Overlay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f8fafc;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      min-width: 320px;
      max-width: 480px;
      padding: 16px 20px;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.85); /* dark, slightly see-through */
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(148, 163, 184, 0.5);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 6px;
    }

    .planet-name {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .sector-name {
      font-size: 0.85rem;
      text-transform: uppercase;
      color: #9ca3af;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 6px 0 10px;
      font-size: 0.95rem;
    }

    .status-label {
      font-weight: 600;
      color: #e5e7eb;
    }

    .status-value {
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.95rem;
      color: #e5e7eb;
    }

    .progress-bar {
      position: relative;
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: rgba(31, 41, 55, 0.9);
      overflow: hidden;
      margin-bottom: 10px;
    }

    .progress-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #22c55e, #a3e635);
      width: 0%;
      transition: width 0.6s ease-out;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.8rem;
      color: #9ca3af;
    }

    .meta-pill {
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.5);
      background: rgba(15, 23, 42, 0.8);
    }

    .error {
      color: #fecaca;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="card" id="planet-card">
    <div class="header">
      <div>
        <div class="planet-name" id="planet-name">Loading…</div>
        <div class="sector-name" id="sector-name"></div>
      </div>
      <div class="sector-name" id="order-type"></div>
    </div>

    <div class="status-row">
      <div class="status-label">Liberation</div>
      <div class="status-value" id="liberation-value">–%</div>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>

    <div class="meta-row">
      <div class="meta-pill" id="enemy-type"></div>
      <div class="meta-pill" id="difficulty"></div>
      <div class="meta-pill" id="player-count"></div>
    </div>

    <div class="error" id="error-message" style="display:none;"></div>
  </div>

  <script>
    async function fetchPlanet() {
      try {
        const res = await fetch("https://api.helldivers2.dev/v1/war/planets", {
          headers: {
            "X-Super-Client": "Fulcrum-Overlay",
            "X-Super-Contact": "your-email-or-handle-here"
          }
        });

        if (!res.ok) {
          throw new Error("HTTP " + res.status);
        }

        const planets = await res.json();

        // TODO: refine this selection logic once we see the exact response shape.
        // For now, just pick the first planet with an active campaign / decent liberation data.
        const planet = planets.find(p => p?.campaignId || p?.liberation) || planets[0];

        if (!planet) {
          throw new Error("No planet data returned.");
        }

        updateCard(planet);
      } catch (err) {
        console.error(err);
        const errorEl = document.getElementById("error-message");
        errorEl.textContent = "Failed to load planet data";
        errorEl.style.display = "block";
      }
    }

    function updateCard(planet) {
      // These property names may need tweaking once you inspect the JSON
      const name = planet.name || planet.planetName || "Unknown Planet";
      const sector = planet.sector || planet.sectorName || "Unknown Sector";
      const enemy = planet.enemy || planet.enemyType || planet.faction || "Unknown Enemy";

      // Liberation is usually 0–100, but sometimes it could be 0–1; clamp/normalize
      let lib = planet.liberation;
      if (lib == null && planet.liberationPercent != null) {
        lib = planet.liberationPercent;
      }
      if (lib != null && lib <= 1) {
        lib = lib * 100;
      }
      lib = Math.max(0, Math.min(100, lib || 0));

      const difficulty = planet.difficulty || planet.maxDifficulty || "";
      const players = planet.playerCount || planet.players || "";

      document.getElementById("planet-name").textContent = name;
      document.getElementById("sector-name").textContent = sector;
      document.getElementById("enemy-type").textContent = enemy;
      document.getElementById("liberation-value").textContent = lib.toFixed(1) + "%";
      document.getElementById("progress-fill").style.width = lib + "%";

      document.getElementById("difficulty").textContent = difficulty ? "Diff: " + difficulty : "";
      document.getElementById("player-count").textContent = players ? "Active: " + players.toLocaleString() : "";

      // Decide some “order type” label
      let order = "";
      if (planet.campaignId) order = "Major Order";
      if (planet.isMajorOrder) order = "Major Order";
      document.getElementById("order-type").textContent = order;
    }

    // Initial load + periodic refresh
    fetchPlanet();
    setInterval(fetchPlanet, 60_000); // refresh every 60s
  </script>
</body>
</html>
